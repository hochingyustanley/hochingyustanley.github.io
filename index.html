<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RE:SEARCH 尋蛋大作戰 - YMCAHK The Beacon</title>
    
    <!-- 核心依賴 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .animate-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-orange-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            // 核心數據 (6 條問題)
            const correctAnswers = { 1: 'B', 2: 'B', 3: 'B', 4: 'B', 5: 'A', 6: 'C' };
            const taskCodes = { 1: 'A7B2', 2: 'K9X4', 3: 'P3M8', 4: 'R5W1', 5: 'E2T6', 6: 'H8N3' };
            const STAFF_PASSCODE = "HELP88";

            const tasks = [
                { id: 1, location: '面向興華街 (玻璃幕牆)', hint: '留意窗外的花園形狀，看看它是圓形還是方形？' },
                { id: 2, location: '面向蘇屋邨 (北面窗戶)', hint: '仔細觀察對面大廈外牆的名字顏色。' },
                { id: 3, location: '面向順寧道 (舊區方向)', hint: '這裡曾是著名的手作工業區，聞一聞空氣中的氣息。' },
                { id: 4, location: '中心大堂 (新設施區)', hint: '設計概念融合了「燈塔」與「光芒」，找找牆上的幾何圖形。' },
                { id: 5, location: '中心正門 (入口處)', hint: '歡迎標語下面隱藏著一個小小的年份數字。' },
                { id: 6, location: '多用途活動室 (創意角)', hint: '牆上的壁畫中有多少隻色彩繽紛的復活蛋？' }
            ];

            // 狀態管理
            const [gameState, setGameState] = useState('login'); 
            const [userData, setUserData] = useState(() => {
                const saved = localStorage.getItem('beacon_user_data');
                return saved ? JSON.parse(saved) : { name: '', email: '', whatsapp: '', agreed: false };
            });
            const [userAnswers, setUserAnswers] = useState(() => JSON.parse(localStorage.getItem('beacon_answers')) || {});
            
            const [powerUps, setPowerUps] = useState(() => JSON.parse(localStorage.getItem('beacon_powerups')) || { used5050: false, usedHint: false });
            const [active5050, setActive5050] = useState([]); 
            const [showHintModal, setShowHintModal] = useState(false);

            const [activeTask, setActiveTask] = useState(null);
            const [manualCode, setManualCode] = useState('');
            const [manualCodeError, setManualCodeError] = useState('');
            const [uniqueId, setUniqueId] = useState('');
            const [formError, setFormError] = useState('');
            
            const scannerRef = useRef(null);
            const [isScanning, setIsScanning] = useState(false);
            const [isAuthorizing, setIsAuthorizing] = useState(false);

            const [feedback, setFeedback] = useState(null);
            const [cooldown, setCooldown] = useState(0);
            const [wrongOptions, setWrongOptions] = useState([]);
            const [attempts, setAttempts] = useState(() => JSON.parse(localStorage.getItem('beacon_attempts')) || {});
            const [staffCodeInput, setStaffCodeInput] = useState('');
            const [staffError, setStaffError] = useState('');

            useEffect(() => {
                let savedId = localStorage.getItem('beacon_quest_user_id');
                if (!savedId) {
                    savedId = `BEACON-${Math.floor(100000 + Math.random() * 900000)}`;
                    localStorage.setItem('beacon_quest_user_id', savedId);
                }
                setUniqueId(savedId);

                if (userData.name && gameState === 'login') {
                    setGameState('list');
                }
                
                if (window.lucide) window.lucide.createIcons();
            }, []);

            useEffect(() => {
                localStorage.setItem('beacon_powerups', JSON.stringify(powerUps));
            }, [powerUps]);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [gameState, feedback, showHintModal, isScanning, isAuthorizing]);

            // 掃描器邏輯
            useEffect(() => {
                let html5QrCode = null;
                if (gameState === 'scan' && isScanning && window.Html5Qrcode) {
                    const startScanner = async () => {
                        try {
                            html5QrCode = new window.Html5Qrcode("qr-reader");
                            scannerRef.current = html5QrCode;
                            await html5QrCode.start(
                                { facingMode: "environment" },
                                { fps: 10, qrbox: { width: 250, height: 250 } },
                                (decodedText) => {
                                    handleCodeSuccess(decodedText.toUpperCase());
                                },
                                () => {} 
                            );
                        } catch (err) {
                            console.error("相機啟動失敗:", err);
                            setIsScanning(false);
                        }
                    };
                    startScanner();
                }
                return () => {
                    if (html5QrCode && html5QrCode.isScanning) {
                        html5QrCode.stop().catch(e => console.log("停止相機出錯", e));
                    }
                };
            }, [gameState, isScanning]);

            // 核心功能：預先請求相機權限
            const requestCameraPermission = async () => {
                setIsAuthorizing(true);
                setFormError('');
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    stream.getTracks().forEach(track => track.stop());
                    return true;
                } catch (err) {
                    console.warn("相機權限被拒絕或發生錯誤:", err);
                    return false;
                } finally {
                    setIsAuthorizing(false);
                }
            };

            const handleCodeSuccess = (code) => {
                const tid = Object.keys(taskCodes).find(k => taskCodes[k] === code.trim());
                if (tid) {
                    const targetTask = tasks.find(t => t.id === parseInt(tid));
                    if (targetTask) {
                        if (scannerRef.current && scannerRef.current.isScanning) {
                            scannerRef.current.stop().then(() => {
                                startTask(targetTask);
                            }).catch(() => startTask(targetTask));
                        } else {
                            startTask(targetTask);
                        }
                    }
                } else {
                    setManualCodeError('代碼錯誤！');
                }
            };

            const startTask = (task) => {
                setIsScanning(false);
                setManualCode('');
                setManualCodeError('');
                setWrongOptions([]);
                setActive5050([]);
                setFeedback(null);
                setCooldown(0);
                setActiveTask(task);
                setGameState('quiz');
            };

            const handleInitialLogin = async (e) => {
                e.preventDefault();
                if (!userData.name.trim()) {
                    setFormError("請輸入你的姓名");
                    return;
                }
                await requestCameraPermission();
                localStorage.setItem('beacon_user_data', JSON.stringify(userData));
                setGameState('list');
            };

            const handleFinalRegistration = (e) => {
                e.preventDefault();
                const hasEmail = userData.email && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(userData.email);
                const hasPhone = userData.whatsapp && userData.whatsapp.length === 8;
                if (!hasEmail && !hasPhone) {
                    setFormError("電郵或 WhatsApp（二選一）為必填且格式需正確");
                    return;
                }
                if (!userData.agreed) {
                    setFormError("必須同意資料使用條款");
                    return;
                }
                setFormError('');
                localStorage.setItem('beacon_user_data', JSON.stringify(userData));
                setGameState('result');
            };

            const handleAnswer = (option) => {
                if (feedback || cooldown > 0 || active5050.includes(option)) return;
                const isCorrect = option === correctAnswers[activeTask.id];
                const currentAttempts = (attempts[activeTask.id] || 0) + 1;
                const newAttempts = { ...attempts, [activeTask.id]: currentAttempts };
                
                setAttempts(newAttempts);
                localStorage.setItem('beacon_attempts', JSON.stringify(newAttempts));

                if (isCorrect) {
                    setFeedback({ type: 'success', message: '答對了！' });
                    const newAns = { ...userAnswers, [activeTask.id]: option };
                    setUserAnswers(newAns);
                    localStorage.setItem('beacon_answers', JSON.stringify(newAns));
                    setTimeout(() => setGameState('list'), 1500);
                } else {
                    setWrongOptions(prev => [...prev, option]);
                    if (currentAttempts === 1) {
                        setCooldown(20);
                        const timer = setInterval(() => {
                            setCooldown(c => {
                                if (c <= 1) { clearInterval(timer); return 0; }
                                return c - 1;
                            });
                        }, 1000);
                    } else {
                        setFeedback({ type: 'error', message: '機會已用完，請找職員協助。' });
                    }
                }
            };

            const handleStaffSubmit = () => {
                if (staffCodeInput.toUpperCase() === STAFF_PASSCODE) {
                    const newAttempts = { ...attempts, [activeTask.id]: 0 };
                    setAttempts(newAttempts);
                    localStorage.setItem('beacon_attempts', JSON.stringify(newAttempts));
                    setFeedback(null);
                    setStaffCodeInput('');
                    setStaffError('');
                } else {
                    setStaffError('授權碼不正確！');
                }
            };

            return (
                <div className="min-h-screen bg-orange-50 pb-10">
                    <header className="bg-gradient-to-r from-pink-500 to-orange-400 text-white p-6 rounded-b-[2.5rem] shadow-lg text-center relative z-20">
                        <span className="text-4xl mb-1 inline-block animate-bounce">🐰</span>
                        <h1 className="text-xl font-black tracking-widest uppercase italic">RE:SEARCH 尋蛋大作戰</h1>
                        <p className="text-pink-100 text-[10px] mt-1 font-bold tracking-widest uppercase">YMCA of Hong Kong The Beacon</p>
                    </header>

                    <main className="max-w-md mx-auto p-5">
                        {/* 初始登入 */}
                        {gameState === 'login' && (
                            <div className="bg-white p-8 rounded-[2.5rem] shadow-xl border-2 border-pink-100 animate-in">
                                <h2 className="text-2xl font-black text-pink-600 text-center mb-6">開始挑戰</h2>
                                <form onSubmit={handleInitialLogin} className="space-y-6">
                                    <div className="relative">
                                        <i data-lucide="user" className="absolute left-4 top-4 text-pink-300 w-5 h-5"></i>
                                        <input 
                                            type="text"
                                            value={userData.name}
                                            onChange={e => setUserData({...userData, name: e.target.value})}
                                            placeholder="輸入你的姓名 *"
                                            disabled={isAuthorizing}
                                            className="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl pl-12 pr-4 py-4 outline-none font-bold text-lg focus:border-pink-300 transition-colors"
                                        />
                                    </div>
                                    {formError && <div className="text-red-500 text-xs font-bold text-center bg-red-50 p-2 rounded-lg">{formError}</div>}
                                    <button 
                                        type="submit" 
                                        disabled={isAuthorizing}
                                        className={`w-full bg-pink-500 text-white py-4 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 ${isAuthorizing ? 'opacity-70 cursor-not-allowed' : ''}`}
                                    >
                                        {isAuthorizing ? (
                                            <>
                                                <div className="w-5 h-5 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
                                                權限請求中...
                                            </>
                                        ) : '進入遊戲'}
                                    </button>
                                    <p className="text-[10px] text-slate-400 text-center font-bold px-4 leading-relaxed italic">
                                        點擊進入後，請於瀏覽器彈窗同意使用相機權限，以便稍後掃描彩蛋 QR 代碼。
                                    </p>
                                </form>
                            </div>
                        )}

                        {gameState === 'list' && (
                            <div className="space-y-4 animate-in">
                                <div className="bg-white/90 backdrop-blur-md p-5 rounded-[2rem] border border-white text-center shadow-md">
                                    <p className="text-slate-600 font-bold">你好，<span className="text-pink-600 font-black">{userData.name}</span>！</p>
                                    <div className="flex justify-center gap-2 mt-2">
                                        <div className={`px-2 py-1 rounded-lg text-[9px] font-black ${powerUps.used5050 ? 'bg-gray-100 text-gray-400' : 'bg-blue-100 text-blue-600'}`}>50/50</div>
                                        <div className={`px-2 py-1 rounded-lg text-[9px] font-black ${powerUps.usedHint ? 'bg-gray-100 text-gray-400' : 'bg-purple-100 text-purple-600'}`}>提示</div>
                                    </div>
                                </div>

                                <button onClick={() => setGameState('scan')} className="w-full bg-yellow-400 p-6 rounded-3xl font-black text-xl text-yellow-900 shadow-[0_8px_0_rgb(217,119,6)] active:translate-y-1 active:shadow-none flex items-center justify-center gap-3">
                                    <i data-lucide="scan" className="w-6 h-6"></i> 發現彩蛋 QR / 代碼
                                </button>

                                <div className="grid gap-3">
                                    {tasks.map(t => (
                                        <div key={t.id} className={`p-4 rounded-2xl border-2 flex items-center justify-between ${userAnswers[t.id] ? 'bg-green-50 border-green-200' : 'bg-white border-pink-100'}`}>
                                            <div className="flex items-center gap-3">
                                                <div className={`w-10 h-10 rounded-full flex items-center justify-center font-black ${userAnswers[t.id] ? 'bg-green-400 text-white' : 'bg-pink-100 text-pink-400'}`}>{userAnswers[t.id] ? '✓' : t.id}</div>
                                                <p className="font-bold text-sm text-slate-700">{userAnswers[t.id] ? t.location : '待解鎖任務'}</p>
                                            </div>
                                            {userAnswers[t.id] && <i data-lucide="check-circle-2" className="text-green-500 w-5 h-5"></i>}
                                        </div>
                                    ))}
                                </div>

                                <button onClick={() => setGameState('registration')} disabled={Object.keys(userAnswers).length < 6} className={`w-full py-5 rounded-2xl font-black text-lg shadow-lg ${Object.keys(userAnswers).length === 6 ? 'bg-pink-500 text-white' : 'bg-slate-200 text-slate-400 opacity-50'}`}>換領禮品 ({Object.keys(userAnswers).length}/6)</button>
                            </div>
                        )}

                        {gameState === 'scan' && (
                            <div className="space-y-4 animate-in">
                                <div className="bg-white p-5 rounded-[2rem] shadow-xl border-2 border-pink-100 min-h-[300px] flex flex-col items-center justify-center">
                                    {!isScanning ? (
                                        <button onClick={() => setIsScanning(true)} className="flex flex-col items-center text-slate-400">
                                            <i data-lucide="camera" className="w-12 h-12 mb-2 text-pink-300"></i>
                                            <p className="font-bold">開啟相機掃描</p>
                                        </button>
                                    ) : (
                                        <div className="w-full">
                                            <div id="qr-reader" className="w-full rounded-2xl bg-black h-64 overflow-hidden"></div>
                                            <button onClick={() => setIsScanning(false)} className="mt-4 w-full text-red-500 font-bold text-xs">取消掃描</button>
                                        </div>
                                    )}
                                </div>
                                
                                {/* 修正手動輸入部分 */}
                                <div className="bg-white p-6 rounded-[2rem] border-2 border-pink-100 text-center shadow-md">
                                    <h3 className="font-black text-pink-600 mb-4">手動輸入代碼</h3>
                                    <div className="flex flex-row gap-2 w-full">
                                        <input 
                                            type="text" 
                                            maxLength="4" 
                                            value={manualCode} 
                                            onChange={e => setManualCode(e.target.value.toUpperCase())} 
                                            className="flex-[2] bg-pink-50 border-2 border-pink-100 rounded-xl py-4 text-center font-black text-2xl w-full min-w-0" 
                                            placeholder="XXXX" 
                                        />
                                        <button 
                                            onClick={() => handleCodeSuccess(manualCode)} 
                                            className="flex-1 bg-pink-500 text-white px-4 rounded-xl font-black whitespace-nowrap min-w-[80px]"
                                        >
                                            確認
                                        </button>
                                    </div>
                                    {manualCodeError && <p className="text-red-500 font-bold text-xs mt-2">{manualCodeError}</p>}
                                </div>
                                <button onClick={() => setGameState('list')} className="w-full text-pink-400 font-bold flex items-center justify-center"><i data-lucide="chevron-left" className="w-5 h-5"></i> 返回列表</button>
                            </div>
                        )}

                        {gameState === 'quiz' && activeTask && (
                            <div className="space-y-4 animate-in">
                                <div className="bg-white p-8 rounded-[2.5rem] shadow-2xl border-t-[12px] border-yellow-400">
                                    <div className="text-center mb-8">
                                        <span className="text-[10px] font-black bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full uppercase">任務地點</span>
                                        <p className="text-lg font-black text-slate-700 mt-2">{activeTask.location}</p>
                                    </div>

                                    {feedback ? (
                                        <div className="py-10 text-center space-y-4">
                                            <div className="text-7xl animate-bounce">{feedback.type === 'success' ? '🎉' : '🙈'}</div>
                                            <p className={`text-xl font-black ${feedback.type === 'success' ? 'text-green-500' : 'text-red-500'}`}>{feedback.message}</p>
                                            {feedback.type === 'error' && (
                                                <div className="space-y-3 pt-4 border-t border-red-50 mt-4">
                                                    <p className="text-xs text-slate-400 font-bold italic">機會已用完，請找職員解鎖：</p>
                                                    <input 
                                                        type="password" 
                                                        value={staffCodeInput} 
                                                        onChange={e => {setStaffCodeInput(e.target.value); setStaffError('');}} 
                                                        className="w-full p-3 rounded-xl border-2 border-pink-100 text-center font-mono" 
                                                        placeholder="STAFF PASSCODE" 
                                                    />
                                                    <button onClick={handleStaffSubmit} className="w-full bg-pink-500 text-white py-3 rounded-xl font-black shadow-md">職員授權解鎖</button>
                                                    {staffError && <p className="text-[10px] text-red-500 font-bold mt-1">{staffError}</p>}
                                                </div>
                                            )}
                                        </div>
                                    ) : cooldown > 0 ? (
                                        <div className="py-10 text-center">
                                            <div className="text-5xl font-black text-pink-500 mb-2">{cooldown}s</div>
                                            <p className="font-bold text-slate-400 italic">冷靜思考中...</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 gap-4">
                                            {['A', 'B', 'C', 'D'].map(opt => (
                                                <button 
                                                    key={opt} 
                                                    disabled={wrongOptions.includes(opt) || active5050.includes(opt)}
                                                    onClick={() => handleAnswer(opt)}
                                                    className={`h-28 rounded-3xl text-4xl font-black border-4 transition-all ${
                                                        active5050.includes(opt) ? 'opacity-0 pointer-events-none' :
                                                        wrongOptions.includes(opt) ? 'bg-gray-100 border-gray-200 text-gray-300' : 
                                                        'bg-white border-yellow-200 text-slate-700 shadow-[0_6px_0_rgb(254,240,138)] active:shadow-none active:translate-y-1'
                                                    }`}
                                                >
                                                    {opt}
                                                </button>
                                            ))}
                                        </div>
                                    )}

                                    {!feedback && cooldown === 0 && (
                                        <div className="mt-8 flex gap-3">
                                            <button onClick={() => {
                                                const correct = correctAnswers[activeTask.id];
                                                const wrongOnes = ['A', 'B', 'C', 'D'].filter(o => o !== correct && !wrongOptions.includes(o)).sort(() => 0.5 - Math.random()).slice(0, 2);
                                                setActive5050(wrongOnes);
                                                setPowerUps({...powerUps, used5050: true});
                                            }} disabled={powerUps.used5050} className={`flex-1 p-3 rounded-2xl border-2 flex flex-col items-center ${powerUps.used5050 ? 'bg-gray-50 border-gray-100 text-gray-300' : 'bg-blue-50 border-blue-200 text-blue-600 shadow-sm active:scale-95'}`}>
                                                <i data-lucide="zap" className="w-5 h-5 mb-1"></i>
                                                <span className="text-[10px] font-black">50/50</span>
                                            </button>
                                            <button onClick={() => {
                                                setShowHintModal(true);
                                                setPowerUps({...powerUps, usedHint: true});
                                            }} disabled={powerUps.usedHint} className={`flex-1 p-3 rounded-2xl border-2 flex flex-col items-center ${powerUps.usedHint ? 'bg-gray-50 border-gray-100 text-gray-300' : 'bg-purple-50 border-purple-200 text-purple-600 shadow-sm active:scale-95'}`}>
                                                <i data-lucide="lightbulb" className="w-5 h-5 mb-1"></i>
                                                <span className="text-[10px] font-black">提示</span>
                                            </button>
                                        </div>
                                    )}
                                    {!feedback && <button onClick={() => setGameState('list')} className="w-full text-slate-400 font-bold text-xs mt-6 uppercase tracking-widest">放棄並返回</button>}
                                </div>
                            </div>
                        )}

                        {gameState === 'registration' && (
                            <div className="bg-white p-8 rounded-[2.5rem] shadow-xl border-2 border-pink-100 animate-in">
                                <div className="text-center mb-6">
                                    <div className="inline-block p-4 bg-green-100 rounded-full mb-4">
                                        <i data-lucide="trophy" className="w-8 h-8 text-green-600"></i>
                                    </div>
                                    <h2 className="text-2xl font-black text-pink-600">恭喜完成挑戰！</h2>
                                    <p className="text-slate-500 font-bold text-sm mt-2">請填寫領獎資料以獲取領獎 ID</p>
                                </div>
                                <form onSubmit={handleFinalRegistration} className="space-y-4">
                                    <div className="p-4 bg-slate-50 rounded-2xl border-2 border-slate-100 space-y-3">
                                        <p className="text-[10px] font-black text-slate-400 uppercase">聯絡方式 (二選一填寫即可)</p>
                                        <div className="relative">
                                            <i data-lucide="mail" className="absolute left-3 top-3.5 text-slate-300 w-4 h-4"></i>
                                            <input 
                                                type="email"
                                                value={userData.email || ''}
                                                onChange={e => setUserData({...userData, email: e.target.value})}
                                                placeholder="電郵地址"
                                                className="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-4 py-3 outline-none font-bold text-sm"
                                            />
                                        </div>
                                        <div className="relative">
                                            <i data-lucide="message-circle" className="absolute left-3 top-3.5 text-slate-300 w-4 h-4"></i>
                                            <input 
                                                type="tel"
                                                maxLength="8"
                                                value={userData.whatsapp || ''}
                                                onChange={e => setUserData({...userData, whatsapp: e.target.value.replace(/\D/g, '')})}
                                                placeholder="WhatsApp 號碼"
                                                className="w-full bg-white border border-slate-200 rounded-xl pl-10 pr-4 py-3 outline-none font-bold text-sm"
                                            />
                                        </div>
                                    </div>

                                    <label className="flex items-start gap-3 cursor-pointer bg-pink-50/50 p-4 rounded-2xl border border-pink-100">
                                        <input 
                                            type="checkbox" 
                                            checked={userData.agreed || false} 
                                            onChange={e => setUserData({...userData, agreed: e.target.checked})} 
                                            className="mt-1 w-5 h-5 accent-pink-500" 
                                        />
                                        <span className="text-[11px] text-slate-500 font-bold">我同意 YMCAHK The Beacon 使用上述資料作宣傳用途。 *</span>
                                    </label>

                                    {formError && <div className="text-red-500 text-xs font-bold text-center bg-red-50 p-2 rounded-lg">{formError}</div>}
                                    <button type="submit" className="w-full bg-pink-500 text-white py-4 rounded-2xl font-black text-lg shadow-lg">提交並領取獎品</button>
                                </form>
                            </div>
                        )}

                        {showHintModal && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-sm animate-in">
                                <div className="bg-white w-full max-w-xs rounded-[2.5rem] p-8 text-center shadow-2xl relative">
                                    <i data-lucide="lightbulb" className="w-12 h-12 text-purple-500 mx-auto mb-4"></i>
                                    <h4 className="text-xl font-black text-purple-600 mb-4">提示錦囊</h4>
                                    <p className="text-slate-600 font-bold leading-relaxed">{activeTask?.hint}</p>
                                    <button onClick={() => setShowHintModal(false)} className="mt-8 w-full bg-purple-500 text-white py-4 rounded-2xl font-black shadow-lg">明白！</button>
                                </div>
                            </div>
                        )}

                        {gameState === 'result' && (
                            <div className="bg-white p-10 rounded-[3rem] shadow-2xl border-4 border-pink-400 text-center animate-in">
                                <i data-lucide="sparkles" className="w-20 h-20 mx-auto text-yellow-400 mb-4"></i>
                                <h2 className="text-2xl font-black text-pink-600">恭喜 {userData.name}！</h2>
                                <div className="my-8 bg-slate-900 p-8 rounded-[2rem] text-white">
                                    <p className="text-[10px] text-yellow-300 mb-2 font-black">Digital Explorer ID</p>
                                    <p className="text-2xl font-mono font-black">{uniqueId}</p>
                                </div>
                                <p className="text-sm font-black text-slate-700 bg-orange-50 py-4 rounded-xl border border-orange-100">請向服務櫃台出示此畫面<br/>領取禮物一份！🎁</p>
                                <button onClick={() => { localStorage.clear(); window.location.reload(); }} className="text-slate-300 text-[10px] mt-6 font-bold uppercase underline">重置遊戲</button>
                            </div>
                        )}
                    </main>

                    <footer className="fixed bottom-0 left-0 w-full text-center p-2 bg-orange-50/80 backdrop-blur-sm">
                        <p className="text-[9px] text-slate-400 font-bold uppercase tracking-tighter">Powered by YMCAHK THE BEACON Team</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
